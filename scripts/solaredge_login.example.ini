# Copy to scripts/solaredge_login.local.ini (git-ignored) and fill in.
# Command-line flags override these values.
[login]
host = raspberrypi.local
remote_dir = /home/pi/solaredge-monitor
# 1Password item holding the OAuth client id and secret (title or item id)
op_item = SolarEdge API
# Sign-in address if you use several 1Password accounts; empty = op default
op_account =
